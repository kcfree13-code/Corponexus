[project]
name = "corponexus-backend"
version = "0.1.0"
description = "CorpNexus - Corporate Intelligence & Graph Engine Backend"
authors = [{ name = "CorpNexus Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "networkx>=3.2.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
